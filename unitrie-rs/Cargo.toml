[package]
name = "unitrie-rs"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-or-later"
description = "RSK unitrie Rust implementation and JNI bridge"

[lib]
name = "unitrie_rs_jni"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
once_cell = "1.20"
tiny-keccak = { version = "2", features = ["keccak"] }

[dev-dependencies]
hex = "0.4"
