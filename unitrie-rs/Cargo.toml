[package]
name = "unitrie-rs"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-or-later"
description = "RSK unitrie Rust implementation and JNI bridge"

[lib]
name = "unitrie_rs_jni"
crate-type = ["cdylib", "rlib"]

[features]
default = ["jni"]
jni = ["dep:dashmap", "dep:jni", "dep:once_cell"]

[dependencies]
dashmap = { version = "6.1", optional = true }
jni = { version = "0.21", optional = true }
once_cell = { version = "1.20", optional = true }
unitrie-rs-core = { path = "../unitrie-rs-core" }
