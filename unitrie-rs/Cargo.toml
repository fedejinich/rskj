[package]
name = "unitrie-rs"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-or-later"
description = "RSK unitrie Rust implementation and JNI bridge"

[lib]
name = "unitrie_rs_jni"
crate-type = ["cdylib", "rlib"]

[dependencies]
dashmap = "6.1"
jni = "0.21"
once_cell = "1.20"
tiny-keccak = { version = "2", features = ["keccak"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bench]]
name = "core_trie_bench"
harness = false
